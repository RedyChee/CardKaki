[project]
name = "cardkaki"
version = "0.1.0"
description = "Telegram bot that recommends the optimal SG credit card for a given checkout"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[webhooks]>=21,<22",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "apscheduler>=3.10,<4",
  "boto3>=1.34",
  "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardkaki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q -p no:launch_testing -p no:launch_ros"
testpaths = ["tests"]
