# CardKaki — 11 cards. Each entry cites the Milelion review consulted.
# Treat values as best-effort starter data; verify against current T&Cs.
#
# v2 enforces caps and min_spend_sgd via per-user txn history. statement_month
# bonuses (UOB VS, Citi Rewards) prompt the user for their statement closing
# day on card-add; calendar_month is the fallback when unset.

- id: hsbc_revo
  name: HSBC Revolution
  issuer: hsbc
  network: visa
  base_rate_mpd: 0.4
  rounding: { method: floor_sgd_1 }
  bonus:
    - rate_mpd: 4.0
      label: online or contactless
      categories:
        [online_shopping, dining_local, contactless, entertainment, dept_store,
         shopping, transport, travel, grab]
      excluded_categories:
        [fast_food_excluded, travel_excluded, airline_excluded, public_transit_excluded,
         wallet_topup, insurance_excluded, education_excluded, utilities_excluded,
         govt_excluded, tax_excluded, hospital_excluded, charity_excluded]
      applies_to_sgd: true
      applies_to_fcy: true
      cap_sgd: 1000
      cap_period: calendar_month
  pool: hsbc_rewards
  tracks_by: posting_date
  fcy_fee: 0.0325
  notes: "Marketed 4 mpd; effective 3.33 mpd via 30k:10k HSBC pts:KF conversion. v1 uses marketed. Source: milelion.com/2026/04/08/review-hsbc-revolution-card"

