- id: uob_vs
  name: UOB Visa Signature
  issuer: uob
  network: visa
  base_rate_mpd: 0.4
  rounding: { method: floor_sgd_5, unis_per_block: 3.5 }
  bonus:
    - rate_mpd: 4.0
      label: overseas/FCY (S$1k FCY/stmt-mo min)
      categories: []   # empty = wildcard; combined with applies_to_fcy=true means any FCY transaction qualifies
      excluded_categories:
        [petrol_uob_excluded, charity_excluded, education_excluded, govt_excluded,
         insurance_excluded, wallet_topup, real_estate_excluded, utilities_excluded]
      applies_to_sgd: false
      applies_to_fcy: true
      cap_sgd: 1200
      cap_period: statement_month
      min_spend_sgd: 1000
      min_spend_period: statement_month
    - rate_mpd: 4.0
      label: petrol + contactless (S$1k SGD/stmt-mo min)
      categories: [petrol, contactless]
      excluded_categories:
        [petrol_uob_excluded, charity_excluded, education_excluded, govt_excluded,
         insurance_excluded, wallet_topup, real_estate_excluded, utilities_excluded]
      applies_to_sgd: true
      applies_to_fcy: false
      cap_sgd: 1200
      cap_period: statement_month
      min_spend_sgd: 1000
      min_spend_period: statement_month
  pool: uob_unis
  tracks_by: posting_date
  fcy_fee: 0.0325
  notes: "Two independent bonus categories post-Sep 2025; min spend tracked separately per category. SPC officially excluded; Shell on paper excluded but works in practice. v2: prompts for statement closing day on add. Source: milelion.com/2025/08/29/review-uob-visa-signature-card"

